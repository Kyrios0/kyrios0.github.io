      // Screen transitions (cross-document View Transitions, styled in global.css), after osu!'s
      // screen stack: going deeper (home > lists > a post) pushes forward, going up comes back.
      // Must run before first paint, so it lives inline in <head>.
      (() => {
        const depth = (url) => {
          const path = new URL(url, location.href).pathname;
          if (path === '/') return 0;
          return /^\/(posts|tags|archives|friends|about)(\/|$)/.test(path) ? 1 : 2;
        };
        const previous = () => {

        // Screens with the osu!-style footer: moving between two of them, it stays put instead of popping in.
        const hasFooter = (url) => /^\/(posts|tags|archives|friends)(\/|$)/.test(new URL(url, location.href).pathname);
        const footer = () => {
          const from = previous();
          return from && hasFooter(from) && hasFooter(location.href) ? 'steady' : '';
        };
        // "forward"/"back", plus "from-menu" when leaving the start screen
        const types = () => {
          const from = previous();
          if (!from) return [];
          const a = depth(from);
          const b = depth(location.href);
          if (b === a) return [];
          return b > a ? (a === 0 ? ['forward', 'from-menu'] : ['forward']) : ['back'];
        };
        document.documentElement.dataset.nav = types()[0] ?? '';
        document.documentElement.dataset.footer = footer();

          const list = types();
          document.documentElement.dataset.nav = list[0] ?? '';

          if (e.viewTransition) list.forEach((t) => e.viewTransition.types.add(t));
        });
